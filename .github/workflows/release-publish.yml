# Verifies that the checksums published with a release match the binaries that
# were actually uploaded.
#
# Safety properties, by design:
#   * it runs only on releases that already exist (or a manual re-run), never on
#     pull requests, so no untrusted change can influence it;
#   * it uses no third-party actions and no secrets;
#   * it needs only read access to this repository - it cannot create, edit or
#     delete a release, an asset, or any repository content;
#   * it never touches the private source repository.
#
# Publishing is deliberately NOT automated here: release artifacts are produced
# and uploaded by the maintainer (or by the private repository's release
# workflow), and this job then independently confirms their integrity. The
# outcome is written to the workflow run summary.

name: Verify release checksums

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify, e.g. v1.0.0"
        required: true
        type: string

# Least privilege: read this repository's releases, nothing else.
permissions:
  contents: read

jobs:
  verify-checksums:
    name: Verify SHA-256 checksums
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release to verify
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            echo "::error::no release tag to verify"; exit 1
          fi
          url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" --jq .html_url)"
          {
            echo "### Checksum verification for \`$tag\`"
            echo
            echo "Release: <$url>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download the published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --clobber
          ls -l dist

      - name: Recompute and compare checksums
        run: |
          set -euo pipefail
          cd dist
          if [ ! -f SHA256SUMS.txt ]; then
            echo "::error::SHA256SUMS.txt is missing from the release"
            exit 1
          fi
          # --strict fails both on a mismatch and on a listed file that is absent.
          sha256sum --check --strict SHA256SUMS.txt
          {
            echo
            echo "| Artifact | SHA-256 |"
            echo "|---|---|"
            while read -r hash name; do
              echo "| \`$name\` | \`$hash\` |"
            done < SHA256SUMS.txt
            echo
            echo "All published checksums match the uploaded artifacts."
            echo
            echo "Verify a download yourself:"
            echo
            echo '```powershell'
            echo 'Get-FileHash ".\LocalServerExposer_1.0.0_x64-setup.exe" -Algorithm SHA256'
            echo '```'
            echo
            echo "> These binaries are not code-signed, so SmartScreen warns on first"
            echo "> run. Verify the checksum before choosing *More info -> Run anyway*."
          } >> "$GITHUB_STEP_SUMMARY"