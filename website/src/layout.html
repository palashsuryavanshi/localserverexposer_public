<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.seoTitle }}</title>
    <meta name="description" content="{{ page.description }}" />
    <link rel="canonical" href="{{ urls.site }}/{{ page.slug }}" />
    <meta name="theme-color" content="#090b10" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ site.name }}" />
    <meta property="og:title" content="{{ page.seoTitle }}" />
    <meta property="og:description" content="{{ page.description }}" />
    <meta property="og:url" content="{{ urls.site }}/{{ page.slug }}" />
    <meta property="og:image" content="{{ urls.site }}/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Local Server Exposer showing discovered local development servers and a running Cloudflare Quick Tunnel" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ page.seoTitle }}" />
    <meta name="twitter:description" content="{{ page.description }}" />
    <meta name="twitter:image" content="{{ urls.site }}/assets/og-image.png" />

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="{{ styleHref }}" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "{{ site.name }}",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Windows 10, Windows 11",
        "description": "{{ site.description }}",
        "url": "{{ urls.site }}/",
        "downloadUrl": "{{#if release.asset}}{{ release.asset.url }}{{/if}}",
        "softwareVersion": "{{ release.version }}",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "maintainer": { "@type": "Person", "name": "{{ site.maintainerName }}", "url": "{{ urls.maintainer }}" }
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {{> header}}
    <main id="main">{{{ content }}}</main>
    {{> footer}}
    <script src="assets/site.js" defer></script>
  </body>
</html>
