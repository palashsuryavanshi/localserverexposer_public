<header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" href="index.html" aria-label="{{ site.name }} — home">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="2.6" y="8.2" width="11.6" height="9.2" rx="2.4" stroke="currentColor" stroke-width="1.6" />
            <path d="M5.8 12.2h4.6M5.8 15h3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M14.4 10.6c2-2.2 3.6-3.6 5.6-4.6" stroke="#35d6e8" stroke-width="1.6" stroke-linecap="round" />
            <circle cx="20.8" cy="5.4" r="2.1" fill="#35d6e8" />
          </svg>
          <span>{{ site.name }}</span>
        </a>

        <nav class="nav" id="primary-nav" aria-label="Primary">
          {{#each navLinks}} {{#if this.isExternal}}
          <a href="{{ this.href }}" target="_blank" rel="noopener">{{ this.label }}</a>
          {{else}}
          <a href="{{ this.href }}">{{ this.label }}</a>
          {{/if}} {{/each}}
          <a class="nav-github" href="{{ urls.repo }}" target="_blank" rel="noopener">GitHub</a>
        </nav>

        <div class="header-actions">
          <a class="btn btn--ghost btn-ghost" href="{{ urls.repo }}" target="_blank" rel="noopener">
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38l-.01-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.93-.89-1.18-.89-1.18-.72-.5.06-.49.06-.49.8.06 1.22.82 1.22.82.71 1.21 1.87.86 2.33.66.07-.52.28-.86.5-1.06-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
            <span>GitHub</span>
          </a>
          <a class="btn btn--primary" href="{{ urls.releases }}" data-download-cta>
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.5v8.2l2.9-2.9 1.06 1.06L8 12.06 4.04 7.86 5.1 6.8l2.9 2.9V1.5h1ZM2.5 12.5h11v1.6h-11z"/></svg>
            <span>Download</span>
          </a>
          <button
            class="nav-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="primary-nav"
            aria-label="Open navigation menu"
          >
            <svg class="icon-menu" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
            <svg class="icon-close" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
          </button>
        </div>
      </div>
    </header>
